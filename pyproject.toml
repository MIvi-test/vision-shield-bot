[project]
name = "vision-shield-bot"
version = "0.1.0"
description = "MAX photo moderation service"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "maxapi==1.2.3",
    "pytest>=8.3,<10",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["apps/max-emulator"]
addopts = "--strict-config --strict-markers"
python_files = ["test_*.py", "*_test.py"]
norecursedirs = [".git", ".venv", "node_modules", "dist", "build"]

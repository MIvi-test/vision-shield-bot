name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        run: python -m pip install uv==0.13.6

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: ty type check
        run: uv run --no-sync ty check

      - name: pytest
        if: ${{ hashFiles('**/test_*.py', '**/*_test.py', '!**/.venv/**', '!**/venv/**', '!**/node_modules/**') != '' }}
        run: uv run --no-sync pytest

      - name: Report missing tests
        if: ${{ hashFiles('**/test_*.py', '**/*_test.py', '!**/.venv/**', '!**/venv/**', '!**/node_modules/**') == '' }}
        run: echo 'Tests are not implemented yet; pytest was skipped.' >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        if: ${{ hashFiles('apps/moderator-ui/package.json') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install frontend dependencies
        if: ${{ hashFiles('apps/moderator-ui/package.json') != '' }}
        working-directory: apps/moderator-ui
        run: npm ci

      - name: Build frontend
        if: ${{ hashFiles('apps/moderator-ui/package.json') != '' }}
        working-directory: apps/moderator-ui
        run: npm run build

      - name: Report missing frontend
        if: ${{ hashFiles('apps/moderator-ui/package.json') == '' }}
        run: echo 'Frontend is not implemented yet; its build was skipped.' >> "$GITHUB_STEP_SUMMARY"
